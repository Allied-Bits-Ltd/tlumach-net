name: Build & Test

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
      - release/*

jobs:
  build_and_test:
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # The test projects target .NET 9 and .NET 10
          dotnet-version: |
            9.0.x
            10.0.x
          
      - name: Build
        run: dotnet build src/Tlumach.Main.sln
        
      - name: Test
        run: dotnet test tests/Tlumach.Tests/Tlumach.Tests.csproj -c Release

      - name: Test the generator
        run: dotnet test tests/Tlumach.GeneratorTests/Tlumach.GeneratorTests.csproj -c Release

      - name: Test the writers
        run: dotnet test tests/Tlumach.WriterTests/Tlumach.WriterTests.csproj -c Release

      - name: Build the Avalonia integration
        run: dotnet build src/Tlumach.Avalonia/Tlumach.Avalonia.csproj -c Release

      - name: Build the WinUI integration (the plain targets used by Uno Platform)
        run: dotnet build src/Tlumach.WinUI/Tlumach.WinUI.csproj -c Release

      - name: Test the Blazor integration
        run: dotnet test tests/Tlumach.BlazorTests/Tlumach.BlazorTests.csproj -c Release

      - name: Test the MVC integration
        run: dotnet test tests/Tlumach.MvcTests/Tlumach.MvcTests.csproj -c Release

      - name: Test the Razor Pages integration
        run: dotnet test tests/Tlumach.RazorPagesTests/Tlumach.RazorPagesTests.csproj -c Release

      - name: Test the FluentValidation integration
        run: dotnet test tests/Tlumach.FluentValidationTests/Tlumach.FluentValidationTests.csproj -c Release

      - name: Test the template engine integrations
        run: dotnet test tests/Tlumach.TemplateEngineTests/Tlumach.TemplateEngineTests.csproj -c Release

      - name: Build the Blazor sample
        run: dotnet build samples/Tlumach.Sample.Blazor/Tlumach.Sample.Blazor.csproj -c Release

      - name: Build the MVC sample
        run: dotnet build samples/Tlumach.Sample.Mvc/Tlumach.Sample.Mvc.csproj -c Release

      - name: Build the Razor Pages sample
        run: dotnet build samples/Tlumach.Sample.RazorPages/Tlumach.Sample.RazorPages.csproj -c Release

      - name: Build the FluentValidation sample
        run: dotnet build samples/Tlumach.Sample.FluentValidation/Tlumach.Sample.FluentValidation.csproj -c Release

      - name: Build the Scriban sample
        run: dotnet build samples/Tlumach.Sample.Scriban/Tlumach.Sample.Scriban.csproj -c Release

      - name: Build the Fluid sample
        run: dotnet build samples/Tlumach.Sample.Fluid/Tlumach.Sample.Fluid.csproj -c Release

      - name: Build the Handlebars.Net sample
        run: dotnet build samples/Tlumach.Sample.HandlebarsNet/Tlumach.Sample.HandlebarsNet.csproj -c Release

      - name: Test the MudBlazor integration
        run: dotnet test tests/Tlumach.MudBlazorTests/Tlumach.MudBlazorTests.csproj -c Release

      - name: Build the MudBlazor sample
        run: dotnet build samples/Tlumach.Sample.MudBlazor/Tlumach.Sample.MudBlazor.csproj -c Release

      - name: Test the Syncfusion Blazor integration
        run: dotnet test tests/Tlumach.SyncfusionTests/Tlumach.SyncfusionTests.csproj -c Release

      # The package allows any Syncfusion version from 29.1.33 on, so the tests also run with the lowest version and with the latest one
      - name: Test the Syncfusion Blazor integration with Syncfusion 29.1.33
        run: dotnet test tests/Tlumach.SyncfusionTests/Tlumach.SyncfusionTests.csproj -c Release -p:SyncfusionGridVersion=29.1.33

      - name: Test the Syncfusion Blazor integration with the latest Syncfusion
        run: dotnet test tests/Tlumach.SyncfusionTests/Tlumach.SyncfusionTests.csproj -c Release "-p:SyncfusionGridVersion=*"

      - name: Build the Syncfusion Blazor sample
        run: dotnet build samples/Tlumach.Sample.Syncfusion/Tlumach.Sample.Syncfusion.csproj -c Release

  # Builds everything that the packages contain, as build-tlumach-net.cmd does, packs and validates the packages, and installs them into consumer projects
  packages:
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 8 and .NET 9 SDKs: the package tests check that the generator runs with them
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Build the solution
        run: dotnet build src/Tlumach.sln -c Release

      - name: Test the Windows Forms integration
        run: dotnet test tests/Tlumach.WinFormsTests.sln -c Release

      - name: Test the WPF integration
        run: dotnet test tests/Tlumach.WpfTests.sln -c Release

      # Tlumach.MAUI needs the MAUI workload, which only this job installs
      - name: Test the MAUI integration
        run: dotnet test tests/Tlumach.MauiTests.sln -c Release

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Create the packages
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          New-Item -ItemType Directory -Force -Path packages | Out-Null
          foreach ($nuspec in Get-ChildItem -Filter *.nuspec) {
            nuget pack $nuspec.FullName -OutputDirectory packages -Properties "version=$version;commit=$env:GITHUB_SHA" -NonInteractive
            if ($LASTEXITCODE) { exit 1 }
          }
          "TLUMACH_VERSION=$version" >> $env:GITHUB_ENV

      - name: Validate the packages
        shell: pwsh
        run: ./tools/Validate-Packages.ps1 -PackageDirectory packages -Version $env:TLUMACH_VERSION

      - name: Test the packages in consumer projects
        shell: pwsh
        run: ./tools/Test-Packages.ps1 -PackageDirectory packages -Version $env:TLUMACH_VERSION -WorkDirectory package-tests -RequireAll

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.nupkg

      - name: Upload the logs of the package tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-tests
          path: package-tests/*.log
