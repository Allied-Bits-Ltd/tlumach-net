; The texts of MudBlazor components. The keys are those of MudBlazor (MudDataGrid_Contains, ...), stored at the root, so Program.cs sets Group = null.
; LanguageResource.resx is the English file of MudBlazor 9.11.0; the other files come from MudBlazor.Translations (see THIRD-PARTY-NOTICES.md).
; A text that a translation lacks comes from the default (English) file, and a key missing everywhere from the English text built into MudBlazor.
defaultFile=LanguageResource.resx
defaultLocale=en
textProcessingMode=DotNet

[translations]
de=LanguageResource.de.resx
uk=LanguageResource.uk.resx
